[databases]
; Keep the connecting user's role: application connections must still be subject to RLS.
studio = host=postgres port=5432 dbname=studio

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = studio
pool_mode = transaction
; Each role gets its own pool, with room left in Postgres for migrations and diagnostics.
default_pool_size = 10
max_db_connections = 20
max_client_conn = 1000
query_wait_timeout = 30
max_prepared_statements = 100
