# Local stand-in for the PlanetScale Postgres database that production reaches through Hyperdrive.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
    ports:
      - '5433:5432'
    volumes:
      - gatekeeper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatekeeper -d gatekeeper']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  gatekeeper-postgres:
