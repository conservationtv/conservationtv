[package]
name = "studio-sdk"
version = "0.0.0"
description = "The studio API's client, generated by progenitor from its down-levelled OpenAPI contract, signing as a device."
edition.workspace = true
publish.workspace = true

[dependencies]
progenitor-client = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4"] }
regress = "0.10"
futures = "0.3"
bytes = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[build-dependencies]
progenitor = "0.15"
openapiv3 = "2"
serde_json = "1"
prettyplease = "0.2"
syn = "2"
quote = "1"
