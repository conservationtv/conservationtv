[workspace]
members = ["sdkgen", "studio-sdk", "edge-agent", "watch"]
exclude = ["vendor/vdo"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# acap-rs's `vdo`, with a passthrough for the encoder settings its builder does not name (vendor/vdo/Cargo.toml).
[patch."https://github.com/AxisCommunications/acap-rs"]
vdo = { path = "vendor/vdo" }
