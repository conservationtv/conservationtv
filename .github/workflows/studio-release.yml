name: studio-release

# Releases one studio stack: the `studio` workflow calls it for staging and prod, and `studio-preview` for the preview
# stack. Callers hold the concurrency group, so only one release of a stack runs at a time.
on:
  workflow_call:
    inputs:
      stack:
        description: The studio stack to release
        type: string
        required: true
      ref:
        description: The commit to release; the caller's by default
        type: string
        default: ''
      restore:
        description: Restore a clone stack's database from its source first (see apps/studio/infrastructure)
        type: boolean
        default: false
    outputs:
      url:
        description: The released web app
        value: ${{ jobs.release.outputs.url }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack }}
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      STACK: ${{ inputs.stack }}
      # Each version is tagged with the commit it was built from.
      VERSION: ${{ inputs.ref || github.sha }}
      RESTORE: ${{ inputs.restore }}
      # The state backend is each project's Pulumi.yaml backend.url, an R2 bucket reached with these S3 credentials.
      AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Pulumi downloads github:// provider plugins through the GitHub API; unauthenticated, runners share its rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: apps/studio/infrastructure
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.250.0

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the stack program
        run: pnpm run build

      # Without apiVersion and webVersion the stack keeps the deployed versions, so this applies only infrastructure
      # changes and the versions uploaded below bind resources that already exist. Restoring sets a clone's restore
      # point as late as PlanetScale allows (five minutes ago), which replaces its database with a new restore of the
      # source's; `pulumi up` keeps it in the stack file, so the deploy below restores nothing more.
      - name: Apply infrastructure
        run: |
          args=()
          if [ "$RESTORE" = true ]; then
            args+=(--config "restorePoint=$(date -u -d '6 minutes ago' +%Y-%m-%dT%H:%M:%SZ)")
          fi
          pulumi up --stack "$STACK" --yes --non-interactive --diff "${args[@]}"

      # drizzle-kit applies the migrations the database has not recorded and ignores records it has no migration for,
      # so a release from a commit missing some of the applied migrations would migrate a schema it has not seen: a
      # clone's are its source's, so a pull request must be up to date with main to be previewed. The
      # metric_point_hypertable migration needs TimescaleDB preloaded, which a new database or clone may not have.
      - name: Check the database
        run: |
          database_url=$(pulumi stack output databaseMigrationUrl --show-secrets --stack "$STACK")
          echo "::add-mask::$database_url"
          export PGSSLROOTCERT=system
          sql() { psql "$database_url" -v ON_ERROR_STOP=1 -At -c "$1"; }
          if ! sql 'show shared_preload_libraries' | grep -qw timescaledb; then
            echo "::error title=TimescaleDB is not preloaded::Add timescaledb to the branch's shared_preload_libraries in PlanetScale"
            exit 1
          fi
          if [ "$(sql "select to_regclass('drizzle.__drizzle_migrations') is not null")" = t ]; then
            missing=$(comm -23 \
              <(sql 'select name from drizzle.__drizzle_migrations' | sed '/^$/d' | sort) \
              <(find ../api/drizzle -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort))
            if [ -n "$missing" ]; then
              echo "::error title=Behind the database's migrations::$VERSION lacks applied migrations; merge main into it: ${missing//$'\n'/ }"
              exit 1
            fi
          fi

      # Migrations must stay compatible with the version still serving until the deployment switches.
      - name: Migrate the database
        run: |
          database_url=$(pulumi stack output databaseMigrationUrl --show-secrets --stack "$STACK")
          echo "::add-mask::$database_url"
          DATABASE_URL="$database_url" pnpm --filter @conservationtv/studio-api run db:migrate

      # The migrations create `studio_app` and grant to it; PlanetScale names its login roles, so the application role
      # logs in under its own name as a member. psql checks the server against the system's certificates.
      - name: Grant the application role
        run: |
          database_url=$(pulumi stack output databaseMigrationUrl --show-secrets --stack "$STACK")
          echo "::add-mask::$database_url"
          app_role=$(pulumi stack output databaseAppRole --stack "$STACK")
          echo 'grant studio_app to :"app_role";' |
            PGSSLROOTCERT=system psql "$database_url" -v ON_ERROR_STOP=1 -v app_role="$app_role"

      - name: Upload a studio API version
        run: |
          secrets="$RUNNER_TEMP/studio-api-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          pulumi stack output apiSecrets --json --show-secrets --stack "$STACK" > "$secrets"
          STACK_OUTPUT_JSON=$(pulumi stack output --json --stack "$STACK") \
            pnpm --filter @conservationtv/studio-api run upload \
            --tag "$VERSION" --message "studio-api $VERSION" --secrets-file "$secrets"

      # The same build for every stack: the web Worker serves the stack's configuration to it as /config.js.
      - name: Build the web app
        working-directory: .
        run: pnpm --filter @conservationtv/web run build

      - name: Upload a studio web version
        run: |
          STACK_OUTPUT_JSON=$(pulumi stack output --json --stack "$STACK") \
            pnpm --filter @conservationtv/studio-web-worker run upload \
            --tag "$VERSION" --message "studio-web $VERSION"

      # Both Workers switch in the one update. The app negotiates operation versions with the API, so it tolerates the
      # moment either runs ahead of the other.
      - name: Deploy the versions
        run: >-
          pulumi up --stack "$STACK" --yes --non-interactive --diff
          --config "apiVersion=$VERSION" --config "webVersion=$VERSION"

      - name: Name the web app's URL
        id: url
        run: echo "url=https://$(pulumi config get webDomain --stack "$STACK")" >> "$GITHUB_OUTPUT"
