name: pr

on:
  pull_request:

# A newer push to the same pull request supersedes the checks still running for the last one.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Each package generates what it needs first (Worker types, React Router types, the fleet build).
      - name: Typecheck
        run: pnpm -r --no-bail typecheck
      # After typecheck, which generates the Worker types the gatekeeper's and studio API's documents are built with.
      # Each API's document, then its SDK, then its CLI: whatever is committed must be what its routes generate.
      - name: Regenerate API contracts, SDKs and CLIs
        run: pnpm -r --filter './apps/agent/**' --filter './apps/studio/**' --filter './apps/controlplane/**' run generate
      - name: Check nothing generated is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error title=Stale generated code::Run 'pnpm --filter <package> generate' for each API whose files changed above (its API, then SDK, then CLI), and commit the result."
            exit 1
          fi

  # Advisory: warns on each versioned contract that changed or was removed relative to the base, without failing.
  contracts:
    runs-on: ubuntu-latest
    env:
      API_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The check reads each API's document as it was at the base commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compare contracts with the base
        run: pnpm -r --no-bail run ci:contracts pr
      # Fails when a snapshot already frozen at the base is edited. Advisory until a contract is released: it reports,
      # but never stops a merge.
      - name: Check frozen snapshots are unchanged
        continue-on-error: true
        run: pnpm -r --no-bail run ci:contracts snapshots
