name: studio

on:
  push:
    branches: [main]
    paths:
      - apps/studio/api/**
      - apps/studio/infrastructure/**
      - apps/studio/sdk/**
      - apps/studio/web/**
      - apps/controlplane/sdk/**
      - packages/reports/**
      - packages/store/**
      - packages/ui/**
      - packages/umbrella/**
      - packages/versioned-api/**
      - pnpm-lock.yaml
      - .github/workflows/studio.yml
  # Pushes to main release to staging; prod is released by hand, from a commit staging already runs. A dispatch must
  # name its stack: below, only a push means staging.
  workflow_dispatch:
    inputs:
      stack:
        description: The studio stack to release
        type: choice
        options: [staging, prod]
        required: true

# One deploy per stack at a time; a newer push waits rather than cancelling an apply in progress.
concurrency:
  group: studio-${{ github.event_name == 'push' && 'staging' || inputs.stack }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.stack }}
    env:
      STACK: ${{ github.event_name == 'push' && 'staging' || inputs.stack }}
      # The state backend is each project's Pulumi.yaml backend.url, an R2 bucket reached with these S3 credentials.
      AWS_ACCESS_KEY_ID: ${{ secrets.PULUMI_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PULUMI_STATE_SECRET_ACCESS_KEY }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Pulumi downloads github:// provider plugins through the GitHub API; unauthenticated, runners share its rate limit.
      GITHUB_TOKEN: ${{ github.token }}
      # The web build uploads its source maps to the studio web Sentry project and creates the release it injects; see
      # apps/studio/web/vite.config.ts. Without the token there are no source maps and no release, and the build goes on.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
      SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.io' }}
      SENTRY_RELEASE: studio-web@${{ github.sha }}
    defaults:
      run:
        working-directory: apps/studio/infrastructure
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.250.0

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build the stack program
        run: pnpm run build

      # Without apiVersion and webVersion the stack keeps the deployed versions, so this applies only infrastructure
      # changes and the versions uploaded below bind resources that already exist.
      - name: Apply infrastructure
        run: pulumi up --stack "$STACK" --yes --non-interactive --diff

      # Migrations must stay compatible with the version still serving until the deployment switches.
      - name: Migrate the database
        run: |
          database_url=$(pulumi stack output databaseMigrationUrl --show-secrets --stack "$STACK")
          echo "::add-mask::$database_url"
          DATABASE_URL="$database_url" pnpm --filter @conservationtv/studio-api run db:migrate

      # The migrations create `studio_app` and grant to it; PlanetScale names its login roles, so the application role
      # logs in under its own name as a member. psql checks the server against the system's certificates.
      - name: Grant the application role
        run: |
          database_url=$(pulumi stack output databaseMigrationUrl --show-secrets --stack "$STACK")
          echo "::add-mask::$database_url"
          app_role=$(pulumi stack output databaseAppRole --stack "$STACK")
          echo 'grant studio_app to :"app_role";' |
            PGSSLROOTCERT=system psql "$database_url" -v ON_ERROR_STOP=1 -v app_role="$app_role"

      - name: Upload a studio API version
        run: |
          secrets="$RUNNER_TEMP/studio-api-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          pulumi stack output apiSecrets --json --show-secrets --stack "$STACK" > "$secrets"
          STACK_OUTPUT_JSON=$(pulumi stack output --json --stack "$STACK") \
            pnpm --filter @conservationtv/studio-api run upload \
            --tag "$GITHUB_SHA" --message "studio-api $GITHUB_SHA" --secrets-file "$secrets"

      # The same build for every stack: the web Worker serves the stack's configuration to it as /config.js.
      - name: Build the web app
        working-directory: .
        run: pnpm --filter @conservationtv/web run build

      - name: Upload a studio web version
        run: |
          STACK_OUTPUT_JSON=$(pulumi stack output --json --stack "$STACK") \
            pnpm --filter @conservationtv/studio-web-worker run upload \
            --tag "$GITHUB_SHA" --message "studio-web $GITHUB_SHA"

      # Both Workers switch in the one update. The app negotiates operation versions with the API, so it tolerates the
      # moment either runs ahead of the other.
      - name: Deploy the versions
        run: >-
          pulumi up --stack "$STACK" --yes --non-interactive --diff
          --config "apiVersion=$GITHUB_SHA" --config "webVersion=$GITHUB_SHA"

      # Records that the release now serves this stack's Sentry environment. Sentry being down never fails a release.
      - name: Record the web deploy in Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $SENTRY_AUTH_TOKEN" --header 'Content-Type: application/json'
          --data "{\"environment\": \"$STACK\"}"
          "$SENTRY_URL/api/0/organizations/$SENTRY_ORG/releases/$SENTRY_RELEASE/deploys/"
