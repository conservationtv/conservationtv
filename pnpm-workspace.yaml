packages:
  - apps/**
  - packages/**
  # The generated PlanetScale SDK copies its package.json into its build output.
  - '!apps/controlplane/infrastructure/sdks/*/bin'

catalog:
  '@better-auth/passkey': 1.7.7
  '@types/pg': 8.23.1
  better-auth: 1.7.7
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  input-otp: 1.5.0
  pg: 8.23.1
  zod: 4.6.2
  '@pulumi/cloudflare': 6.22.0
  '@pulumi/command': 1.2.1
  '@pulumi/digitalocean': 4.83.0
  '@pulumi/openstack': 5.5.2
  '@pulumi/pulumi': 3.268.0
  '@pulumi/random': 4.21.2
  '@pulumi/tls': 5.6.1
  '@pulumiverse/acme': 0.18.1

# Keep providers and workspace packages on the same Pulumi runtime.
overrides:
  '@pulumi/pulumi': 'catalog:'
  # Better Auth accepts two kysely majors; one resolution keeps a single drizzle-orm instance across the workspace.
  kysely: 0.29.6
  # valibot's optional TypeScript peer would split hono-openapi by each package's TypeScript (6 where Hey API needs
  # the compiler API, 7 elsewhere). Route metadata is keyed by a per-instance symbol, so every package must share one.
  'valibot>typescript': '-'

allowBuilds:
  '@prisma/client': false
  '@pulumi/command': true
  better-sqlite3: false
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
  - '@pulumi/digitalocean@4.83.0'
