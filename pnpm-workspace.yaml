packages:
  - apps/**
  - packages/**

catalog:
  '@pulumi/cloudflare': 6.22.0
  '@pulumi/cloudinit': 1.6.2
  '@pulumi/command': 1.2.1
  '@pulumi/digitalocean': 4.83.0
  '@pulumi/openstack': 5.5.2
  '@pulumi/pulumi': 3.268.0
  '@pulumi/random': 4.21.2
  '@pulumi/tls': 5.6.1
  '@pulumiverse/acme': 0.18.1

# Keep providers and workspace packages on the same Pulumi runtime.
overrides:
  '@pulumi/pulumi': 'catalog:'

allowBuilds:
  '@pulumi/command': true
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
  - '@pulumi/digitalocean@4.83.0'
