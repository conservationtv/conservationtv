packages:
  - apps/**
  - packages/**
  - tools/review
  # The generated PlanetScale SDK copies its package.json into its build output.
  - '!apps/controlplane/infrastructure/sdks/*/bin'

catalog:
  '@arkenv/standard': 1.0.0-rc.4
  '@better-auth/passkey': 1.7.7
  '@types/pg': 8.23.1
  better-auth: 1.7.7
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  input-otp: 1.5.0
  # A fork of the Node binding adding Incoming.acceptWithoutNatTraversal(), until iroh ships it. The agent hands its
  # endpoint to iroh-http-node, which must load the same native addon.
  '@number0/iroh': npm:@strangecyan/iroh@1.1.0-relayed.1
  '@strangecyan/iroh-http-node': 0.3.0
  pg: 8.23.1
  typescript: 7.0.2
  zod: 4.6.2
  '@pulumi/cloudflare': 6.22.0
  '@pulumi/command': 1.2.1
  '@pulumi/digitalocean': 4.83.0
  '@pulumi/openstack': 5.5.2
  '@pulumi/pulumi': 3.268.0
  '@pulumi/random': 4.21.2
  '@pulumi/tls': 5.6.1
  '@pulumiverse/acme': 0.18.1

# Keep providers and workspace packages on the same Pulumi runtime.
overrides:
  '@pulumi/pulumi': 'catalog:'
  # Better Auth accepts two kysely majors; one resolution keeps a single drizzle-orm instance across the workspace.
  kysely: 0.29.6
  # valibot's optional TypeScript peer would split hono-openapi by each package's TypeScript. Route metadata is keyed
  # by a per-instance symbol, so every package must share one.
  'valibot>typescript': '-'

allowBuilds:
  '@prisma/client': false
  '@pulumi/command': true
  better-sqlite3: false
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false
  workerd: true

minimumReleaseAgeExclude:
  - '@pulumi/digitalocean@4.83.0'
  - '@strangecyan/iroh-darwin-arm64@1.1.0-relayed.1'
  - '@strangecyan/iroh-linux-arm64-gnu@1.1.0-relayed.1'
  - '@strangecyan/iroh-linux-arm64-musl@1.1.0-relayed.1'
  - '@strangecyan/iroh-linux-x64-gnu@1.1.0-relayed.1'
  - '@strangecyan/iroh-linux-x64-musl@1.1.0-relayed.1'
  - '@strangecyan/iroh-win32-x64-msvc@1.1.0-relayed.1'
  - '@strangecyan/iroh@1.1.0-relayed.1'
  - '@strangecyan/iroh-http-core@0.3.0'
  - '@strangecyan/iroh-http-node@0.3.0'
